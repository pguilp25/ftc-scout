<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a78d6">
  <title>FTC Scouting</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="eventName">FTC Scouting</h1>
      <span class="sub">scouting</span>
      <span class="mode-badge" id="modeBadge">◐</span>
      <button class="btn" data-action="theme" style="padding:4px 10px;margin-left:8px" title="Toggle light/dark">◐</button>
    </div>
    <nav>
      <button data-nav="scout" class="active">Scout</button>
      <button data-nav="ranking">Best for us</button>
      <button data-nav="leaders">Leaders</button>
      <button data-nav="teams">All teams</button>
    </nav>
  </header>
  <main id="main"></main>

  <!-- Load order matters: config → stats → charts → store → app. Classic
       scripts (no modules) so the app also runs by double-clicking this file. -->
  <script src="js/config.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
